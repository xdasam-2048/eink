<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPhone 墨水屏藍牙傳圖</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 14px; margin: 0; }
  h2 { margin: 6px 0 4px; font-size: 20px; }
  p { color: #aaa; font-size: 13px; margin: 0 0 10px; }
  select, input, button { font-size: 15px; padding: 12px 14px; margin: 5px 0; border-radius: 12px; border: none; width: 92%; max-width: 400px; }
  select, input { background: #2a2a2a; color: #fff; }
  .row { display: flex; justify-content: center; gap: 8px; width: 92%; max-width: 400px; margin: 4px auto; }
  .row button { width: 50%; margin: 0; background: #2c2c2e; color: #fff; font-size: 14px; }
  .slider-box { display: flex; align-items: center; justify-content: center; gap: 10px; width: 92%; max-width: 400px; margin: 6px auto; font-size: 14px; color: #ccc; }
  .slider-box input { flex: 1; padding: 0; margin: 0; }
  #sendBtn { background: #0a84ff; color: #fff; font-weight: bold; font-size: 16px; margin-top: 8px; }
  #sendBtn:disabled { background: #444; color: #888; }
  canvas { max-width: 92%; max-height: 310px; border: 2px solid #555; margin-top: 8px; background: #fff; border-radius: 6px; touch-action: none; }
  #status { margin-top: 10px; color: #30d158; font-weight: bold; font-size: 15px; }
</style>
</head>
<body>
  <h2>🖼️ iPhone 墨水屏藍牙傳圖</h2>
  <p>可自由選擇螢幕尺寸及「純黑白 / 三色」輸出</p>

  <select id="screenSelect" onchange="changeConfig()">
    <option value="800x480">7.5 / 7.4 吋 大屏 (800 × 480)</option>
    <option value="640x384">7.5 吋 老款屏 (640 × 384)</option>
    <option value="648x480">5.73 / 5.83 吋 屏 (648 × 480)</option>
    <option value="400x300">4.2 吋 屏 HINK-E042A13 (400 × 300)</option>
  </select>

  <select id="colorSelect" onchange="changeConfig()">
    <option value="BW">⚫⚪ 純黑白輸出 (速度快、適合相片)</option>
    <option value="3C">⚫⚪🔴 三色輸出 黑白紅 (有紅色層)</option>
  </select>

  <input type="file" id="imageInput" accept="image/*">

  <div class="row">
    <button type="button" onclick="toggleMode()">🔄 橫向 / 直向</button>
    <button type="button" onclick="rotateImg()">↻ 旋轉 90°</button>
  </div>

  <div class="slider-box">
    <span>縮放</span>
    <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.05" value="1.0">
    <button type="button" style="width:auto; padding:6px 10px; margin:0; background:#3a3a3c; font-size:13px;" onclick="resetTransform()">置中</button>
  </div>
  
  <div>
    <canvas id="previewCanvas" width="800" height="480"></canvas>
  </div>

  <button id="sendBtn" onclick="connectAndSend()" disabled>📡 連接藍牙並傳送到墨水屏</button>
  <div id="status">請先選擇規格並從相簿挑選圖片</div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_UUID    = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let hwW = 800, hwH = 480, colorMode = "BW";
let isPortrait = false, imgAngle = 0;
let offsetX = 0, offsetY = 0, zoomFactor = 1.0;
let currentImg = null, packedData = null;
let isDragging = false, lastX = 0, lastY = 0, initialPinchDist = 0, initialZoom = 1.0;

const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const zoomSlider = document.getElementById('zoomSlider');

function changeConfig() {
  const val = document.getElementById('screenSelect').value;
  const xPos = val.indexOf('x');
  hwW = Number(val.slice(0, xPos));
  hwH = Number(val.slice(xPos + 1));
  colorMode = document.getElementById('colorSelect').value;
  offsetX = 0; offsetY = 0;
  if (currentImg) { renderPreview(true); }
  else {
    canvas.width = isPortrait ? hwH : hwW;
    canvas.height = isPortrait ? hwW : hwH;
    statusEl.innerText = "已設定：" + hwW + "×" + hwH + " (" + (colorMode === '3C' ? '黑白紅三色' : '純黑白') + ")";
  }
}

document.getElementById('imageInput').addEventListener('change', function(e) {
  const file = e.target.files.item(0);
  if (!file) return;
  statusEl.innerText = "正在處理圖片...";
  const img = new Image();
  img.onload = function() { currentImg = img; imgAngle = 0; resetTransform(); };
  img.src = URL.createObjectURL(file);
});

zoomSlider.addEventListener('input', function(e) { zoomFactor = parseFloat(e.target.value); if (currentImg) renderPreview(false); });
zoomSlider.addEventListener('change', function() { if (currentImg) renderPreview(true); });

function resetTransform() { offsetX = 0; offsetY = 0; zoomFactor = 1.0; zoomSlider.value = 1.0; if (currentImg) renderPreview(true); }

function toggleMode() {
  isPortrait = !isPortrait; offsetX = 0; offsetY = 0;
  if (currentImg) { renderPreview(true); }
  else {
    canvas.width = isPortrait ? hwH : hwW;
    canvas.height = isPortrait ? hwW : hwH;
  }
}

function rotateImg() { imgAngle = (imgAngle + 90) % 360; offsetX = 0; offsetY = 0; if (currentImg) renderPreview(true); }

canvas.addEventListener('touchstart', function(e) {
  if (!currentImg) return; e.preventDefault();
  if (e.touches.length === 1) {
    const t0 = e.touches.item(0);
    isDragging = true; lastX = t0.clientX; lastY = t0.clientY;
  } else if (e.touches.length === 2) {
    const t0 = e.touches.item(0), t1 = e.touches.item(1);
    isDragging = false;
    initialPinchDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    initialZoom = zoomFactor;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (!currentImg) return; e.preventDefault();
  const scaleRatio = canvas.width / canvas.getBoundingClientRect().width;
  if (e.touches.length === 1 && isDragging) {
    const t0 = e.touches.item(0);
    offsetX += (t0.clientX - lastX) * scaleRatio;
    offsetY += (t0.clientY - lastY) * scaleRatio;
    lastX = t0.clientX; lastY = t0.clientY;
    renderPreview(false);
  } else if (e.touches.length === 2) {
    const t0 = e.touches.item(0), t1 = e.touches.item(1);
    const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    zoomFactor = Math.min(3.0, Math.max(0.5, initialZoom * (dist / initialPinchDist)));
    zoomSlider.value = zoomFactor.toFixed(2);
    renderPreview(false);
  }
}, { passive: false });

canvas.addEventListener('touchend', function() { if (currentImg) { isDragging = false; renderPreview(true); } });
canvas.addEventListener('mousedown', function(e) { if (currentImg) { isDragging = true; lastX = e.clientX; lastY = e.clientY; } });
window.addEventListener('mousemove', function(e) {
  if (!isDragging || !currentImg) return;
  const scaleRatio = canvas.width / canvas.getBoundingClientRect().width;
  offsetX += (e.clientX - lastX) * scaleRatio; offsetY += (e.clientY - lastY) * scaleRatio;
  lastX = e.clientX; lastY = e.clientY; renderPreview(false);
});
window.addEventListener('mouseup', function() { if (isDragging && currentImg) { isDragging = false; renderPreview(true); } });

function matchColor(r, g, b, is3C) {
  // 0=黑(0,0,0), 1=白(255,255,255), 2=紅(220,20,20)
  const d0 = r*r + g*g + b*b;
  const d1 = (r-255)*(r-255) + (g-255)*(g-255) + (b-255)*(b-255);
  if (!is3C) return (d0 < d1) ? 0 : 1;
  const d2 = (r-220)*(r-220)*0.8 + (g-20)*(g-20)*1.2 + (b-20)*(b-20)*1.2;
  if (d2 < d0 && d2 < d1) return 2;
  return (d0 < d1) ? 0 : 1;
}

function renderPreview(applyDither) {
  const viewW = isPortrait ? hwH : hwW, viewH = isPortrait ? hwW : hwH;
  canvas.width = viewW; canvas.height = viewH;
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, viewW, viewH);

  const rotW = (imgAngle % 180 === 0) ? currentImg.width : currentImg.height;
  const rotH = (imgAngle % 180 === 0) ? currentImg.height : currentImg.width;
  const finalScale = Math.max(viewW / rotW, viewH / rotH) * zoomFactor;

  ctx.save();
  ctx.translate(viewW / 2 + offsetX, viewH / 2 + offsetY);
  ctx.rotate(imgAngle * Math.PI / 180);
  ctx.drawImage(currentImg, (-currentImg.width * finalScale) / 2, (-currentImg.height * finalScale) / 2, currentImg.width * finalScale, currentImg.height * finalScale);
  ctx.restore();

  if (!applyDither) return;

  const is3C = (colorMode === "3C");
  const imgData = ctx.getImageData(0, 0, viewW, viewH), d = imgData.data;
  const buf = new Float32Array(viewW * viewH * 3);
  for (let i = 0; i < viewW * viewH; i++) {
    const p4 = i * 4, p3 = i * 3;
    if (!is3C) {
      const g = 0.299 * d.at(p4) + 0.587 * d.at(p4+1) + 0.114 * d.at(p4+2);
      buf.set(Float32Array.of(g, g, g), p3);
    } else {
      buf.set(Float32Array.of(d.at(p4), d.at(p4+1), d.at(p4+2)), p3);
    }
  }

  const clsMap = new Uint8Array(viewW * viewH);
  const spread = function(nx, ny, er, eg, eb, w) {
    if (nx >= 0 && nx < viewW && ny < viewH) {
      const ni = (ny * viewW + nx) * 3;
      buf.set(Float32Array.of(buf.at(ni) + er*w, buf.at(ni+1) + eg*w, buf.at(ni+2) + eb*w), ni);
    }
  };

  for (let y = 0; y < viewH; y++) {
    for (let x = 0; x < viewW; x++) {
      const idx = y * viewW + x, p3 = idx * 3;
      const or = buf.at(p3), og = buf.at(p3+1), ob = buf.at(p3+2);
      const ci = matchColor(or, og, ob, is3C);
      clsMap.set(Uint8Array.of(ci), idx);
      const nr = (ci === 1) ? 255 : (ci === 2 ? 220 : 0);
      const ng = (ci === 1) ? 255 : (ci === 2 ? 20 : 0);
      const nb = (ci === 1) ? 255 : (ci === 2 ? 20 : 0);
      const er = or - nr, eg = og - ng, eb = ob - nb;

      spread(x+1, y, er, eg, eb, 7/16);
      spread(x-1, y+1, er, eg, eb, 3/16);
      spread(x, y+1, er, eg, eb, 5/16);
      spread(x+1, y+1, er, eg, eb, 1/16);

      d.set(Uint8ClampedArray.of(nr, ng, nb, 255), idx * 4);
    }
  }
  ctx.putImageData(imgData, 0, 0);

  const planeBytes = (hwW * hwH) / 8;
  packedData = new Uint8Array(is3C ? planeBytes * 2 : planeBytes);

  for (let hy = 0; hy < hwH; hy++) {
    for (let hx = 0; hx < hwW; hx++) {
      const vx = isPortrait ? hy : hx, vy = isPortrait ? (hwW - 1) - hx : hy;
      const c = clsMap.at(vy * viewW + vx);
      const bitIdx = hy * hwW + hx;
      const bytePos = bitIdx >> 3;
const bitMask = 1 << (7 - (bitIdx & 7));
if (c !== 0) packedData.set(Uint8Array.of(packedData.at(bytePos) | bitMask), bytePos);
if (is3C && c === 2) {
const rPos = planeBytes + bytePos;
packedData.set(Uint8Array.of(packedData.at(rPos) | bitMask), rPos);
}
}
}
document.getElementById('sendBtn').disabled = false;
statusEl.innerText = "就緒：" + hwW + "×" + hwH + " (" + (is3C ? "三色模式" : "黑白模式") + ")";
}
async function connectAndSend() {
if (!packedData) return;
const btn = document.getElementById('sendBtn'); btn.disabled = true;
try {
statusEl.innerText = "正在搜尋 E-Ink_Frame...";
const device = await navigator.bluetooth.requestDevice({
filters: Array.of({ name: "E-Ink_Frame" }),
optionalServices: Array.of(SERVICE_UUID)
});
statusEl.innerText = "正在連接 iPhone 藍牙...";
const server = await device.gatt.connect();
const service = await server.getPrimaryService(SERVICE_UUID);
const char = await service.getCharacteristic(CHAR_UUID);
const encoder = new TextEncoder();
await char.writeValueWithResponse(encoder.encode("START"));
await new Promise(function(r) { setTimeout(r, 150); });
const CHUNK = 160;
for (let i = 0; i < packedData.length; i += CHUNK) {
await char.writeValueWithoutResponse(packedData.slice(i, i + CHUNK));
await new Promise(function(r) { setTimeout(r, 22); });
if (i % (CHUNK * 12) === 0) statusEl.innerText = "穩定傳送中... " + Math.round((i / packedData.length) * 100) + "%";
}
await new Promise(function(r) { setTimeout(r, 200); });
await char.writeValueWithResponse(encoder.encode("END"));
statusEl.innerText = "✅ 傳送完成！墨水屏正在清屏並刷新...";
setTimeout(function() { device.gatt.disconnect(); btn.disabled = false; }, 2000);
} catch (err) {
statusEl.innerText = "❌ 錯誤：" + err.message;
btn.disabled = false;
}
}
