<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPhone 墨水屏藍牙傳圖</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 14px; margin: 0; }
  h2 { margin: 6px 0 4px; font-size: 20px; }
  p { color: #aaa; font-size: 13px; margin: 0 0 10px; }
  select, input, button { font-size: 15px; padding: 12px 14px; margin: 6px 0; border-radius: 12px; border: none; width: 92%; max-width: 400px; }
  select, input[type="file"] { background: #2a2a2a; color: #fff; }
  .row { display: flex; justify-content: center; gap: 8px; width: 92%; max-width: 400px; margin: 4px auto; }
  .row button { width: 50%; margin: 0; background: #2c2c2e; color: #fff; font-size: 14px; }
  .slider-box { display: flex; align-items: center; justify-content: center; gap: 10px; width: 92%; max-width: 400px; margin: 6px auto; font-size: 14px; color: #ccc; }
  .slider-box input[type="range"] { flex: 1; padding: 0; margin: 0; }
  #sendBtn { background: #0a84ff; color: #fff; font-weight: bold; font-size: 16px; margin-top: 8px; }
  #sendBtn:disabled { background: #444; color: #888; }
  canvas { max-width: 92%; max-height: 330px; border: 2px solid #555; margin-top: 8px; background: #fff; border-radius: 6px; touch-action: none; cursor: grab; }
  #status { margin-top: 10px; color: #30d158; font-weight: bold; font-size: 15px; }
</style>
</head>
<body>
  <h2>🖼️ iPhone 墨水屏藍牙傳圖</h2>
  <p>選擇螢幕尺寸後，手指可直接在框內拖拉移動及縮放</p>

  <select id="screenSelect" onchange="changeScreen()">
    <option value="648x480">5.73 / 5.83 吋 黑白屏 (648 × 480)</option>
    <option value="800x480">7.5 吋 新版黑白屏 (800 × 480)</option>
    <option value="640x384">7.5 吋 老款黑白屏 (640 × 384)</option>
  </select>

  <input type="file" id="imageInput" accept="image/*">

  <div class="row">
    <button type="button" onclick="toggleMode()">🔄 橫向 / 直向</button>
    <button type="button" onclick="rotateImg()">↻ 旋轉 90°</button>
  </div>

  <div class="slider-box">
    <span>縮放</span>
    <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.05" value="1.0">
    <button type="button" style="width:auto; padding:6px 10px; margin:0; background:#3a3a3c; font-size:13px;" onclick="resetTransform()">置中</button>
  </div>
  
  <div>
    <canvas id="previewCanvas" width="648" height="480"></canvas>
  </div>

  <button id="sendBtn" onclick="connectAndSend()" disabled>📡 連接藍牙並傳送到墨水屏</button>
  <div id="status">請先選擇螢幕型號及從相簿挑選圖片</div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_UUID    = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let hwW = 648, hwH = 480, isPortrait = false, imgAngle = 0;
let offsetX = 0, offsetY = 0, zoomFactor = 1.0;
let currentImg = null, packedData = null;
let isDragging = false, lastX = 0, lastY = 0, initialPinchDist = 0, initialZoom = 1.0;

const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const zoomSlider = document.getElementById('zoomSlider');

function changeScreen() {
  const [w, h] = document.getElementById('screenSelect').value.split('x').map(Number);
  hwW = w; hwH = h; offsetX = 0; offsetY = 0;
  if (currentImg) { renderPreview(true); }
  else {
    canvas.width = isPortrait ? hwH : hwW;
    canvas.height = isPortrait ? hwW : hwH;
    statusEl.innerText = `已切換螢幕規格：${hwW} × ${hwH}`;
  }
}

document.getElementById('imageInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { currentImg = img; imgAngle = 0; resetTransform(); };
  img.src = URL.createObjectURL(file);
});

zoomSlider.addEventListener('input', (e) => { zoomFactor = parseFloat(e.target.value); if (currentImg) renderPreview(false); });
zoomSlider.addEventListener('change', () => { if (currentImg) renderPreview(true); });

function resetTransform() { offsetX = 0; offsetY = 0; zoomFactor = 1.0; zoomSlider.value = 1.0; if (currentImg) renderPreview(true); }

function toggleMode() {
  isPortrait = !isPortrait; offsetX = 0; offsetY = 0;
  if (currentImg) { renderPreview(true); }
  else {
    canvas.width = isPortrait ? hwH : hwW;
    canvas.height = isPortrait ? hwW : hwH;
    statusEl.innerText = isPortrait ? `已切換為直向 (${hwH}×${hwW})` : `已切換為橫向 (${hwW}×${hwH})`;
  }
}

function rotateImg() { imgAngle = (imgAngle + 90) % 360; offsetX = 0; offsetY = 0; if (currentImg) renderPreview(true); }

canvas.addEventListener('touchstart', (e) => {
  if (!currentImg) return; e.preventDefault();
  if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  else if (e.touches.length === 2) {
    isDragging = false;
    initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    initialZoom = zoomFactor;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!currentImg) return; e.preventDefault();
  const scaleRatio = canvas.width / canvas.getBoundingClientRect().width;
  if (e.touches.length === 1 && isDragging) {
    offsetX += (e.touches[0].clientX - lastX) * scaleRatio;
    offsetY += (e.touches[0].clientY - lastY) * scaleRatio;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    renderPreview(false);
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zoomFactor = Math.min(3.0, Math.max(0.5, initialZoom * (dist / initialPinchDist)));
    zoomSlider.value = zoomFactor.toFixed(2);
    renderPreview(false);
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { if (currentImg) { isDragging = false; renderPreview(true); } });
canvas.addEventListener('mousedown', (e) => { if (currentImg) { isDragging = true; lastX = e.clientX; lastY = e.clientY; } });
window.addEventListener('mousemove', (e) => {
  if (!isDragging || !currentImg) return;
  const scaleRatio = canvas.width / canvas.getBoundingClientRect().width;
  offsetX += (e.clientX - lastX) * scaleRatio; offsetY += (e.clientY - lastY) * scaleRatio;
  lastX = e.clientX; lastY = e.clientY; renderPreview(false);
});
window.addEventListener('mouseup', () => { if (isDragging && currentImg) { isDragging = false; renderPreview(true); } });

function renderPreview(applyDither) {
  const viewW = isPortrait ? hwH : hwW, viewH = isPortrait ? hwW : hwH;
  canvas.width = viewW; canvas.height = viewH;
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, viewW, viewH);

  const rotW = (imgAngle % 180 === 0) ? currentImg.width : currentImg.height;
  const rotH = (imgAngle % 180 === 0) ? currentImg.height : currentImg.width;
  const finalScale = Math.max(viewW / rotW, viewH / rotH) * zoomFactor;

  ctx.save();
  ctx.translate(viewW / 2 + offsetX, viewH / 2 + offsetY);
  ctx.rotate(imgAngle * Math.PI / 180);
  ctx.drawImage(currentImg, (-currentImg.width * finalScale) / 2, (-currentImg.height * finalScale) / 2, currentImg.width * finalScale, currentImg.height * finalScale);
  ctx.restore();

  if (!applyDither) return;

  const imgData = ctx.getImageData(0, 0, viewW, viewH), d = imgData.data, gray = new Float32Array(viewW * viewH);
  for (let i = 0; i < viewW * viewH; i++) gray[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];

  for (let y = 0; y < viewH; y++) {
    for (let x = 0; x < viewW; x++) {
      const idx = y * viewW + x, oldPixel = gray[idx], newPixel = oldPixel < 128 ? 0 : 255;
      gray[idx] = newPixel; const err = oldPixel - newPixel;
      if (x + 1 < viewW) gray[idx + 1] += err * 7 / 16;
      if (x - 1 >= 0 && y + 1 < viewH) gray[idx + viewW - 1] += err * 3 / 16;
      if (y + 1 < viewH) gray[idx + viewW] += err * 5 / 16;
      if (x + 1 < viewW && y + 1 < viewH) gray[idx + viewW + 1] += err / 16;
      const cIdx = idx * 4; d[cIdx] = d[cIdx+1] = d[cIdx+2] = newPixel;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  packedData = new Uint8Array((hwW * hwH) / 8);
  for (let hy = 0; hy < hwH; hy++) {
    for (let hx = 0; hx < hwW; hx++) {
      const vx = isPortrait ? hy : hx, vy = isPortrait ? (hwW - 1) - hx : hy;
      if (gray[vy * viewW + vx] > 128) {
        const bitIdx = hy * hwW + hx;
        packedData[bitIdx >> 3] |= (1 << (7 - (bitIdx & 7)));
      }
    }
  }
  document.getElementById('sendBtn').disabled = false;
  statusEl.innerText = `構圖已就緒 (${hwW}×${hwH})！點擊下方按鈕傳送`;
}

async function connectAndSend() {
  if (!packedData) return;
  const btn = document.getElementById('sendBtn'); btn.disabled = true;
  try {
    statusEl.innerText = "正在搜尋 E-Ink_Frame...";
    const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "E-Ink_Frame" }], optionalServices: [SERVICE_UUID] });
    statusEl.innerText = "正在連接 iPhone 藍牙...";
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const char = await service.getCharacteristic(CHAR_UUID);
    const encoder = new TextEncoder();
    await char.writeValueWithResponse(encoder.encode("START"));
    await new Promise(r => setTimeout(r, 150));

    const CHUNK = 160;
    for (let i = 0; i < packedData.length; i += CHUNK) {
      await char.writeValueWithoutResponse(packedData.slice(i, i + CHUNK));
      await new Promise(r => setTimeout(r, 22));
      if (i % (CHUNK * 10) === 0) statusEl.innerText = `穩定傳送中... ${Math.round((i / packedData.length) * 100)}%`;
    }

    await new Promise(r => setTimeout(r, 200));
    await char.writeValueWithResponse(encoder.encode("END"));
    statusEl.innerText = "✅ 傳送完成！墨水屏正在清屏並刷新...";
    setTimeout(() => { device.gatt.disconnect(); btn.disabled = false; }, 2000);
  } catch (err) {
    statusEl.innerText = "❌ 錯誤：" + err.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
